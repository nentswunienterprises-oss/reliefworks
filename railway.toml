# Railway deployment configuration
# This file documents the deployment setup for Relief Works API

[build]
# Install dependencies
builder = "nixpacks"

[env]
# Supabase Database Configuration
DATABASE_URL = "postgresql://postgres:your_url_encoded_password@db.qwtrkqolpsclidiqpoff.supabase.co:5432/postgres"
SUPABASE_URL = "https://qwtrkqolpsclidiqpoff.supabase.co"
SUPABASE_SERVICE_ROLE_KEY = "your_supabase_service_role_key"

# Server Configuration
NODE_ENV = "production"
PORT = "5000"

[deploy]
# Build command to create production bundle
buildCommand = "npm run build"

# Start command to run the server
startCommand = "node dist/index.cjs"

# Health check
healthcheckPath = "/"
healthcheckTimeout = 100
